name: CI

on:
  pull_request:
  push:
    branches: [staging, prod]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Required status check for staging and prod (see docs/BRANCHING.md) – keep the name stable.
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs; Dependabot keeps them up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Stand-in for GitHub secret scanning (not available for private repos on the free plan).
      - run: node scripts/check-secrets.ts

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Validates all questions/entities (unknown ids, empty answer sets, masterball outside the set …).
      - run: npm run content:build
      - run: npm run build
