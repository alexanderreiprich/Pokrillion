# Formen und Entwicklungen. Generiert, danach von Hand gepflegt.

- id: pokedex.form.mega
  category: pokedex
  group: form
  difficulty: 3
  prompt:
    de: Nenne ein Pokémon mit Mega-Entwicklung
    en: Name a Pokémon that can Mega Evolve
  answers:
    query: { kind: pokemon, where: { forms: mega } }
  masterball: pokemon:audino
  source: PokéAPI pokemon (Formen *-mega*)
  notes: Enthält auch die Mega-Entwicklungen aus Legenden Z-A.

