# Kategorie „Pokédex“: allgemeines Pokémon-Wissen, kuratierte Listen.
# Vorlagen-Fragen (Farben, Typen, Generationen, Formen) liegen in pokedex-*.yaml.
# Format & Regeln: docs/KONZEPT.md §8 · Schema: src/lib/content/schema.ts

- id: pokedex.legendary
  category: pokedex
  difficulty: 2
  prompt:
    de: Nenne ein legendäres oder mysteriöses Pokémon
    en: Name a Legendary or Mythical Pokémon
  answers:
    query:
      - { kind: pokemon, where: { legendary: true } }
      - { kind: pokemon, where: { mythical: true } }
  masterball: pokemon:cosmog
  source: PokéAPI pokemon_species.is_legendary / is_mythical

